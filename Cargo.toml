# A virtual workspace rather than a package at the root. `core/` is the
# technology-free library, `cli/` the published command and `xtask/` runs the
# gates.
#
# The split is not cosmetic. While the crate sat at the repository root, its
# package directory *was* the repository root, so `cargo stern4rust` walked
# `xtask/tests/**` and reported its test functions as living "in the source
# tree" -- files belonging to a different package entirely. `--package` does
# not narrow it, because the scope is the directory.
[workspace]
members = ["core", "cli", "xtask"]
resolver = "3"

# Declared once here; every member takes them with `.workspace = true`, so a
# version is bumped in one place and no two members can disagree.
[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
authors = ["Umberto Gotti"]
license = "MIT"
repository = "https://github.com/umbgtt10/slotgate"

[workspace.dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
slotgate-core = { path = "core", version = "0.7.0" }
syn = { version = "2.0.117", features = ["full", "visit"] }
tempfile = "3"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "time",
    "process",
    "fs",
    "sync",
    "io-util",
] }

# Every member and every target: no `unsafe` anywhere in the workspace. core
# says so at its crate root as well.
[workspace.lints.rust]
unsafe_code = "forbid"
