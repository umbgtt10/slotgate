[package]
name = "slotgate"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Umberto Gotti"]
description = "A bounded-parallelism job runner that gives each slot its own disjoint port range, so port-binding tests run in parallel without collisions."
license = "MIT"
repository = "https://github.com/umbgtt10/slotgate"
readme = "README.md"
keywords = ["testing", "parallel", "ports", "ci"]
categories = ["development-tools::testing", "command-line-utilities"]

[[bin]]
name = "slotgate"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.6.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "time",
    "process",
    "fs",
    "sync",
    "io-util",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
